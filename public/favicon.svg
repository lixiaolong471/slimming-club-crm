<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 背景 -->
  <rect width="32" height="32" rx="6" fill="#10B981"/>
  
  <!-- 体重秤的简化图标 -->
  <g transform="translate(16, 16)">
    <!-- 秤盘 -->
    <rect x="-10" y="2" width="20" height="3" rx="1.5" fill="white"/>
    
    <!-- 显示屏 -->
    <rect x="-7" y="-4" width="14" height="5" rx="1" fill="white" opacity="0.9"/>
    
    <!-- 体重下降箭头 -->
    <path d="M 0,-8 L 0,-2 M -2,-5 L 0,-2 L 2,-5" 
          stroke="#10B981" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none"/>
    
    <!-- 脚印 -->
    <ellipse cx="-3" cy="0" rx="1.5" ry="1" fill="white" opacity="0.7"/>
    <ellipse cx="3" cy="0" rx="1.5" ry="1" fill="white" opacity="0.7"/>
  </g>
</svg>